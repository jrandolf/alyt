name: Restrict pull requests

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  close-outside-pull-request:
    if: >-
      github.event.pull_request.author_association != 'OWNER' &&
      github.event.pull_request.author_association != 'MEMBER' &&
      github.event.pull_request.author_association != 'COLLABORATOR' &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.user.login != 'renovate[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Close outside pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMENT: >-
            This repository accepts proposals through GitHub Discussions.
            Please start a Discussion at
            https://github.com/${{ github.repository }}/discussions/new and wait
            for a maintainer to review it. If accepted, a Mathematic maintainer
            or agent will open the pull request.
        run: >-
          gh pr close "$PR_NUMBER"
          --repo "$GITHUB_REPOSITORY"
          --comment "$COMMENT"
