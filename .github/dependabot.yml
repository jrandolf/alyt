version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /examples/basic
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /examples/custom-plugin
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /examples/nextjs
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
